<div class="category-selector">
  <h2>Select category</h2>

  <div class="category-list">
    <!-- Ei kirjoiteta kolmea kategoriaa erikseen, vaan käydään läpi categories() -funktiosta saatu
    lista for-loopilla. track category.id kertoo, että jokaisella kategoriapainikkeella on oma
    uniikki id, jota käytetään seurannassa. -->
    @for (category of categories(); track category.id) {
      <button
        mat-stroked-button
        [class.selected]="category.id === selectedCategoryId()"
        [attr.aria-pressed]="category.id === selectedCategoryId()"
        (click)="selectCategory(category)"
      >
        <mat-icon>{{ category.icon }}</mat-icon>
        {{ category.name }}
      </button>
    }
  </div>
</div>
