<div class="converter">
  <p>Convert between different units of measurement.</p>

  <app-category-selector
    [categories]="categories"
    [selectedCategoryId]="selectedCategory().id"
    (categorySelected)="selectCategory($event)"
  />

  <div class="conversion-inputs">
    <div>
      <label for="input-value">Value</label>
      <input
        id="input-value"
        type="number"
        [value]="inputValue()"
        (input)="updateInputValue($any($event.target).value)"
      />

      <app-unit-selector
        [units]="selectedCategory().units"
        [selectedUnitId]="fromUnit().id"
        (unitSelected)="selectFromUnit($event)"
      />
    </div>

    <div>
      <label>Convert to</label>

      <app-unit-selector
        [units]="selectedCategory().units"
        [selectedUnitId]="toUnit().id"
        (unitSelected)="selectToUnit($event)"
      />
    </div>

    <button mat-raised-button (click)="convert()">Convert</button>

    @if (result() !== null) {
      <div class="conversion-result">
        <h2>Result</h2>
        <p>{{ result() }} {{ toSymbol() }}</p>
      </div>
    }
  </div>
</div>
